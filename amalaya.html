<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#6a11cb,#2575fc,#00c6ff,#00d084);
background-size:400% 400%;
animation:bg 12s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.calculator{
width:420px;
padding:20px;
border-radius:25px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.title{
color:Green;
text-align:center;
font-size:24px;
font-weight:bold;
margin-bottom:15px;
}

#display{
width:100%;
height:70px;
font-size:30px;
border:none;
border-radius:15px;
padding:15px;
margin-bottom:20px;
text-align:right;
background:rgba(255,255,255,.25);
color:Purple;
outline:none;
}

.buttons{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
}

button{
height:60px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:#ffffff22;
color:white;
transition:.2s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 8px 18px rgba(0,0,0,.25);
}

button:active{
transform:scale(.95);
}

.red{background:#ff4d6d;}
.green{background:#00c896;}
.orange{background:#ff9800;}
.purple{background:#8b5cf6;}

.equal{
grid-column:span 5;
background:linear-gradient(90deg,#ff9800,#ff5722);
font-size:24px;
}
</style>

</head>
<body>
  
<div class="calculator">
<div>messiah Scientific Calculator</div>
<div class="title">Scientific Calculator</div>

<input type="text" id="display" readonly>

<div class="buttons">

<button class="red" onclick="clearDisplay()">AC</button>
<button class="red" onclick="backspace()">⌫</button>
<button class="purple" onclick="append('(')">(</button>
<button class="purple" onclick="append(')')">)</button>
<button class="orange" onclick="append('/')">÷</button>

<button class="green" onclick="append('Math.sin(')">sin</button>
<button class="green" onclick="append('Math.cos(')">cos</button>
<button class="green" onclick="append('Math.tan(')">tan</button>
<button class="green" onclick="append('Math.sqrt(')">√</button>
<button class="orange" onclick="append('*')">×</button>

<button class="green" onclick="append('Math.log10(')">log</button>
<button class="green" onclick="append('Math.log(')">ln</button>
<button class="green" onclick="append('Math.PI')">π</button>
<button class="green" onclick="append('Math.E')">e</button>
<button class="orange" onclick="append('-')">−</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button class="green" onclick="square()">x²</button>
<button class="orange" onclick="append('+')">+</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button class="green" onclick="append('**')">xʸ</button>
<button class="green" onclick="factorial()">x!</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>

<button class="equal" onclick="calculate()">=</button>

</div>

</div>

<script>
const display=document.getElementById("display");

function append(value){
display.value+=value;
}

function clearDisplay(){
display.value="";
}

function backspace(){
display.value=display.value.slice(0,-1);
}

function calculate(){
try{
display.value=eval(display.value);
}catch{
display.value="Error";
}
}

function square(){
try{
display.value=Math.pow(eval(display.value),2);
}catch{
display.value="Error";
}
}

function factorial(){
try{
let n=eval(display.value);

if(n<0){
display.value="Error";
return;
}

let fact=1;

for(let i=2;i<=n;i++){
fact*=i;
}

display.value=fact;

}catch{
display.value="Error";
}
}

document.addEventListener("keydown",function(e){

if((e.key>='0'&&e.key<='9')||"+-*/().".includes(e.key)){
display.value+=e.key;
}

if(e.key==="Enter"){
calculate();
}

if(e.key==="Backspace"){
backspace();
}

if(e.key==="Delete"){
clearDisplay();
}

});
</script>

</body>
</html>
